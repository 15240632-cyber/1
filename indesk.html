<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？</title>
  <style>
    /* 重要外觀參數：可在這裡調整主色與頁面寬度 */
    :root {
      --main-color: #e97845;
      --main-hover: #d96532;
      --background: #fff8f1;
      --text-color: #342b27;
      --muted-color: #786d66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text-color);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 600px;
      padding: 32px;
      background: #fff;
      border: 1px solid #f1e3d8;
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(92, 57, 35, 0.09);
    }

    .icon { font-size: 42px; text-align: center; }

    h1 {
      margin: 8px 0;
      text-align: center;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
    }

    .intro {
      margin: 0 0 26px;
      text-align: center;
      color: var(--muted-color);
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 160px;
      padding: 14px;
      resize: vertical;
      border: 1px solid #dfd2c8;
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.8;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--main-color);
      box-shadow: 0 0 0 3px rgba(233, 120, 69, 0.15);
    }

    .hint {
      margin: 8px 0 18px;
      color: var(--muted-color);
      font-size: 0.9rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--main-color);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: var(--main-hover); }
    button:active:not(:disabled) { transform: scale(0.99); }
    button:focus-visible { outline: 3px solid #342b27; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    button.secondary {
      background: #f5e8df;
      color: #5b4031;
    }

    button.secondary:hover:not(:disabled) { background: #ead7c9; }

    .result {
      margin-top: 22px;
      padding: 22px 16px;
      min-height: 124px;
      display: grid;
      place-content: center;
      text-align: center;
      border: 2px dashed #f0c6ad;
      border-radius: 16px;
      background: #fffaf6;
    }

    .result-label {
      margin-bottom: 8px;
      color: var(--muted-color);
      font-size: 0.95rem;
    }

    #resultText {
      margin: 0;
      color: var(--main-hover);
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #statusText {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--muted-color);
      text-align: center;
      font-size: 0.95rem;
    }

    .history {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #fff8f1;
    }

    .history h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    #drawnList {
      margin: 0;
      padding-left: 28px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    #drawnList:empty::after {
      content: "還沒有抽出的選項";
      color: var(--muted-color);
      margin-left: -28px;
    }

    .remaining {
      margin: 12px 0 0;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .app { padding: 24px 18px; }
      .buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="icon" aria-hidden="true">🍽️</div>
    <h1>今天吃什麼？</h1>
    <p class="intro">每個選項本輪只會抽中一次，抽完再開新一輪！</p>

    <label for="optionsInput">你的美食清單（每行一個選項）</label>
    <textarea id="optionsInput" spellcheck="false">便當
麵
咖哩
水餃</textarea>
    <p class="hint">空白行會忽略；完全相同的重複選項只保留一個。修改清單會自動重新開始一輪。</p>

    <div class="buttons">
      <button id="drawButton" type="button">🎲 幫我選</button>
      <button id="resetButton" class="secondary" type="button">🔄 開始新一輪</button>
    </div>

    <section class="result" aria-live="polite" aria-atomic="true">
      <div class="result-label">✨ 這次抽中的是</div>
      <p id="resultText">等你來抽籤</p>
    </section>
    <p id="statusText" role="status">準備好了，可以開始抽籤！</p>

    <section class="history" aria-live="polite">
      <h2>📋 本輪抽出順序</h2>
      <ol id="drawnList"></ol>
      <p class="remaining" id="remainingText">本輪剩餘 4 個選項</p>
    </section>
  </main>

  <script>
    // 取得頁面元素
    const optionsInput = document.getElementById("optionsInput");
    const drawButton = document.getElementById("drawButton");
    const resetButton = document.getElementById("resetButton");
    const resultText = document.getElementById("resultText");
    const statusText = document.getElementById("statusText");
    const drawnList = document.getElementById("drawnList");
    const remainingText = document.getElementById("remainingText");

    // 本輪狀態：有效清單、尚未抽出的選項、已抽出順序
    let allOptions = [];
    let remainingOptions = [];
    let drawnOptions = [];

    // 將輸入文字整理成有效清單：去除前後空白、空白行與重複項目
    function getValidOptions() {
      const lines = optionsInput.value
        .split(/\r?\n/)
        .map(function (option) {
          return option.trim();
        })
        .filter(function (option) {
          return option.length > 0;
        });

      return [...new Set(lines)];
    }

    // 依目前輸入清單建立新一輪，並清除舊結果
    function startNewRound() {
      allOptions = getValidOptions();
      remainingOptions = [...allOptions];
      drawnOptions = [];

      resultText.textContent = "等你來抽籤";
      drawnList.replaceChildren();

      if (allOptions.length === 0) {
        statusText.textContent = "請先輸入至少一個選項";
      } else {
        statusText.textContent = "新一輪開始！準備好了，可以抽籤。";
      }

      updateDisplay();
    }

    // 更新剩餘數量、抽籤按鈕狀態與已抽順序
    function updateDisplay() {
      remainingText.textContent = "本輪剩餘 " + remainingOptions.length + " 個選項";
      drawButton.disabled = remainingOptions.length === 0;

      drawnList.replaceChildren();
      drawnOptions.forEach(function (option) {
        const item = document.createElement("li");
        item.textContent = option;
        drawnList.appendChild(item);
      });
    }

    // 抽出一個尚未抽過的選項，本輪不重複
    function drawOption() {
      // 每次抽籤前同步整理清單；若清單已改動，重新開始一輪
      const currentOptions = getValidOptions();
      if (currentOptions.length !== allOptions.length ||
          currentOptions.some(function (option, index) {
            return option !== allOptions[index];
          })) {
        startNewRound();
      }

      if (remainingOptions.length === 0) {
        resultText.textContent = "這輪抽完了";
        statusText.textContent = "這輪抽完了，請開始新一輪。";
        updateDisplay();
        return;
      }

      const randomIndex = Math.floor(Math.random() * remainingOptions.length);
      const chosenOption = remainingOptions.splice(randomIndex, 1)[0];

      drawnOptions.push(chosenOption);
      resultText.textContent = chosenOption;

      if (remainingOptions.length === 0) {
        statusText.textContent = "這輪抽完了";
      } else {
        statusText.textContent = "抽籤成功！每個選項本輪只會抽中一次。";
      }

      updateDisplay();
    }

    drawButton.addEventListener("click", drawOption);

    // 按下新一輪按鈕，恢復目前清單中的全部有效選項
    resetButton.addEventListener("click", startNewRound);

    // 使用者一修改文字清單，就清除舊結果並立即開始新一輪
    optionsInput.addEventListener("input", startNewRound);

    // 頁面載入時初始化
    startNewRound();
  </script>
</body>
</html>
